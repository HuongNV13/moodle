issueNumber: MDL-90406
notes:
  mod_forum:
    - message: >-
        Added the REST API route `GET /api/rest/v2/mod_forum/forums/{forumId}/discussions`
        to get the discussions of a forum, with the `sortOrder`, `sortDirection`, `page`, `perPage` and
        `groupId` query parameters. The route is protected by the new
        `mod_forum:discussion:read` scope.
      type: improved
